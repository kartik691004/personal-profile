    <!--
      Fonts used to be pulled in with an @import inside index.css, which forces the
      browser to download and parse the CSS bundle before it even discovers them.
      Linking here lets the request start immediately, in parallel.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Michroma&display=swap"
    />
